<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QWERTY42 — critical-thinking probe</title>
<!--
  QWERTY42 // critical-thinking probe  (3D verzia)
  DP: Výskum vplyvu generických a adaptívnych nástrojov UI v školskom prostredí (FIIT STU)
  Samostatný súbor, offline, bez knižníc. Prvá (grafická) verzia ostáva v index.html.

  Odpovede sú REÁLNE hodnoty (čísla/riešenia). QWERTY42 (3D postava) vysloví
  konkrétnu odpoveď (často NESPRÁVNU) = "návnada". Offloading sa meria skryte:
  kto zvolí návnadu, išiel za AI naslepo.
    GENERICKÝ : QWERTY42 projektuje priame TVRDENIE (občas mylné).
    ADAPTÍVNY : QWERTY42 projektuje NÁVODNÚ otázku (bez odpovede).
    KONTROLA  : QWERTY42 offline.
-->
<style>
  :root{ --bg:#0a0a0a; --fg:#e8e8e8; --dim:#8f8f8f; --dimmer:#565656; --line:#242424; --hi:#ffffff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;}
  body{ font-family:"SF Mono","JetBrains Mono","Menlo","DejaVu Sans Mono",monospace;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased;}
  .win{ width:min(900px,97vw);height:min(680px,94vh);background:var(--bg);
    border:1px solid var(--line);border-radius:9px;overflow:hidden;display:flex;flex-direction:column;position:relative;
    box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.02) inset;}
  .bar{ height:36px;flex:0 0 36px;display:flex;align-items:center;gap:9px;padding:0 13px;
    border-bottom:1px solid var(--line);color:var(--dim);font-size:12px;background:linear-gradient(#141414,#0d0d0d);}
  .dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--dimmer)}
  .title{flex:1;text-align:center;letter-spacing:.4px;color:var(--dim)}

  /* ---------- 3D STAGE ---------- */
  .stage{ position:relative;height:196px;flex:0 0 196px;border-bottom:1px solid var(--line);
    perspective:760px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#141414,#060606);}
  .stage::before{ content:"";position:absolute;left:-20%;right:-20%;bottom:-10%;height:150%;
    background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/100% 24px,
              linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/24px 100%;
    transform:rotateX(70deg) scale(1.6);transform-origin:bottom;opacity:.35;
    -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);}
  .robot{ position:absolute;left:70px;top:18px;width:120px;height:160px;transform-style:preserve-3d;
    animation:bob 4.2s ease-in-out infinite;}
  .head{ position:absolute;left:20px;top:22px;width:80px;height:80px;transform-style:preserve-3d;animation:sway 7s ease-in-out infinite;}
  .face{ position:absolute;width:80px;height:80px;border:1px solid rgba(255,255,255,.16);}
  .f-front { transform:translateZ(40px);background:linear-gradient(150deg,#1f1f1f,#0d0d0d);}
  .f-back  { transform:rotateY(180deg) translateZ(40px);background:#090909;}
  .f-right { transform:rotateY(90deg) translateZ(40px);background:#070707;}
  .f-left  { transform:rotateY(-90deg) translateZ(40px);background:#161616;}
  .f-top   { transform:rotateX(90deg) translateZ(40px);background:#262626;}
  .f-bottom{ transform:rotateX(-90deg) translateZ(40px);background:#040404;}
  .visor{ position:absolute;left:11px;top:29px;width:58px;height:20px;background:#000;
    border:1px solid rgba(255,255,255,.28);border-radius:3px;overflow:hidden;box-shadow:inset 0 0 10px rgba(255,255,255,.12);}
  .scan{ position:absolute;top:0;left:-35%;width:35%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);animation:scan 2.8s linear infinite;}
  .eye{ position:absolute;top:6px;left:50%;width:7px;height:7px;margin-left:-3px;border-radius:50%;
    background:#fff;box-shadow:0 0 9px #fff;opacity:.85;}
  .cheek{ position:absolute;top:58px;width:8px;height:3px;background:rgba(255,255,255,.25);}
  .cheek.l{left:16px} .cheek.r{right:16px}
  .antenna{ position:absolute;left:59px;top:0;width:2px;height:24px;background:rgba(255,255,255,.35);transform:translateZ(40px);}
  .antenna .tip{ position:absolute;top:-7px;left:-4px;width:10px;height:10px;border-radius:50%;
    background:#fff;box-shadow:0 0 12px #fff;animation:pulse 2.6s ease-in-out infinite;}
  .voice{ position:absolute;left:36px;top:118px;display:flex;gap:3px;height:16px;align-items:flex-end;opacity:0;transition:opacity .18s;}
  .voice i{ width:4px;height:16px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.5);transform-origin:bottom;transform:scaleY(.18);}
  .base{ position:absolute;left:26px;top:150px;width:68px;height:12px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);filter:blur(1px);animation:bob2 4.2s ease-in-out infinite;}
  .qmark{ position:absolute;left:96px;top:6px;color:#fff;font-size:22px;opacity:0;text-shadow:0 0 10px #fff;transition:opacity .25s;}

  .robot.speaking .scan{animation-duration:1.1s}
  .robot.speaking .voice{opacity:1}
  .robot.speaking .voice i{animation:eq .55s ease-in-out infinite}
  .robot.speaking .voice i:nth-child(2){animation-delay:.08s}
  .robot.speaking .voice i:nth-child(3){animation-delay:.16s}
  .robot.speaking .voice i:nth-child(4){animation-delay:.24s}
  .robot.speaking .voice i:nth-child(5){animation-delay:.32s}
  .robot.thinking .head{animation:sway 7s ease-in-out infinite, tilt 3.4s ease-in-out infinite}
  .robot.thinking .qmark{opacity:1;animation:floatq 2.2s ease-in-out infinite}
  .robot.offline{filter:grayscale(1) brightness(.42);animation:none}
  .robot.offline .scan{opacity:0;animation:none}
  .robot.offline .eye{opacity:.15;box-shadow:none}
  .robot.offline .antenna .tip{background:#333;box-shadow:none;animation:none}

  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes bob2{0%,100%{transform:scale(1);opacity:.22}50%{transform:scale(.82);opacity:.12}}
  @keyframes sway{0%,100%{transform:rotateY(-22deg)}50%{transform:rotateY(22deg)}}
  @keyframes tilt{0%,100%{transform:rotateY(-22deg) rotateZ(-7deg)}50%{transform:rotateY(22deg) rotateZ(7deg)}}
  @keyframes scan{0%{left:-35%}100%{left:100%}}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
  @keyframes eq{0%,100%{transform:scaleY(.18)}50%{transform:scaleY(1)}}
  @keyframes floatq{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  /* hologram s faktom */
  .holo{ position:absolute;right:18px;top:30px;width:340px;max-width:46%;padding:11px 13px;display:none;
    border:1px solid rgba(255,255,255,.28);border-radius:6px;background:rgba(255,255,255,.035);
    box-shadow:0 0 30px rgba(255,255,255,.06),inset 0 0 20px rgba(255,255,255,.02);}
  .holo.query{border-style:dashed}
  .holo.show{animation:holoIn .42s cubic-bezier(.2,.9,.2,1)}
  .holo::before{content:"";position:absolute;left:-52px;top:24px;width:52px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4));}
  .holoTag{font-size:10px;letter-spacing:.16em;color:var(--dim)}
  .holoText{margin-top:5px;color:var(--hi);font-size:13px;line-height:1.5;min-height:1.5em;white-space:pre-wrap}
  @keyframes holoIn{from{clip-path:inset(0 100% 0 0);opacity:0}to{clip-path:inset(0 0 0 0);opacity:1}}

  /* ---------- terminál ---------- */
  .screen{ flex:1;overflow-y:auto;padding:18px 22px 24px;color:var(--fg);font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
  .screen::-webkit-scrollbar{width:9px}.screen::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
  .dim{color:var(--dim)}.hi{color:var(--hi)}.q{color:var(--fg)}
  .q42log{color:var(--dim)}
  .opts{margin:4px 0 2px}
  .opt{cursor:pointer;color:var(--fg);padding:1px 0}
  .opt:hover{color:var(--hi);background:rgba(255,255,255,.04)}
  .opt.done{cursor:default}.opt.good{color:var(--hi)}.opt.good::after{content:"  ◄ zvolené"}.opt.bad{color:var(--dimmer)}
  .good{color:var(--hi)}.bad{color:var(--dimmer)}.rule{color:var(--line)}
  .inp{background:transparent;border:none;outline:none;color:var(--hi);font:inherit;caret-color:var(--hi);min-width:12ch}
  .caret{display:inline-block;width:8px;height:1.05em;background:var(--fg);vertical-align:-2px;margin-left:2px;animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .btn{display:inline-block;border:1px solid var(--dimmer);color:var(--fg);padding:4px 12px;margin:2px 8px 2px 0;cursor:pointer;border-radius:4px;font:inherit}
  .btn:hover{border-color:var(--fg);color:var(--hi)}
  .win::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);mix-blend-mode:overlay;}
</style>
</head>
<body>
  <div class="win">
    <div class="bar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>

<script>
/* ============ BANKA ÚLOH ============ */
const DIMS = {

  pravdepodobnost:"PRAVDEPODOBNOSŤ", logika:"LOGIKA A PRÍČINNOSŤ",
};
const BANK = [
  { id:"v1", dim:"verifikacia", aiCorrect:false,

    q:"Koľko je obsah kruhu?",

    solve:"Obsah = π·r² = π·9 ≈ 28,27 cm². Hodnota 18,85 je obvod (2·π·r)." },
  { id:"v2", dim:"verifikacia", aiCorrect:false,

    generic:"Bratislava má približne 2,3 milióna obyvateľov.",
    socratic:"Koľko obyvateľov má celé Slovensko (~5,4 mil.)? Koľko z toho reálne pripadá na jedno mesto?",
    q:"Koľko obyvateľov má Bratislava?",
    opts:[{t:"≈ 2,3 milióna",lure:true},{t:"≈ 475 000",correct:true},{t:"≈ 1,1 milióna"},{t:"≈ 130 000"}],
    solve:"Bratislava má ~475 tis. obyvateľov. 2,3 mil. je nereálne — takmer polovica Slovenska." },
  { id:"v3", dim:"verifikacia", aiCorrect:true,
    brief:"Auto prejde 150 km za 2 hodiny. Akou priemernou rýchlosťou išlo?",
    generic:"Priemerná rýchlosť je 75 km/h.",
    socratic:"Rýchlosť = dráha ÷ čas.",
    q:"Priemerná rýchlosť?",
    opts:[{t:"75 km/h",correct:true,lure:true},{t:"300 km/h"},{t:"30 km/h"},{t:"152 km/h"}],
    solve:"150 ÷ 2 = 75 km/h. QWERTY42 mal tentokrát pravdu — no over aj tak." },
  { id:"c1", dim:"vypocet", aiCorrect:false,
    brief:"Sveter stojí 80 €. Najprv zľava 25 %, z novej ceny ešte 10 %.",
    generic:"Spolu je to 35 % zľava, teda zaplatíš 52 €.",
    socratic:"Zľavy sa NEsčítavajú. Najprv 80·0,75, a až z výsledku zober 10 %.",
    q:"Koľko nakoniec zaplatíš?",
    opts:[{t:"52 €",lure:true},{t:"54 €",correct:true},{t:"56 €"},{t:"60 €"}],
    solve:"80·0,75 = 60 €; 60·0,90 = 54 €. Zľavy sa násobia, nie sčítavajú." },
  { id:"c2", dim:"vypocet", aiCorrect:false,
    brief:"Tam ideš rýchlosťou 60 km/h, späť tú istú cestu 30 km/h.",

    socratic:"Priemer rýchlostí nie je (60+30)/2, keď je vzdialenosť rovnaká. Zvoľ napr. 60 km a spočítaj celkový čas.",
    q:"Aká je priemerná rýchlosť za celú cestu (tam aj späť)?",
    opts:[{t:"45 km/h",lure:true},{t:"40 km/h",correct:true},{t:"50 km/h"},{t:"90 km/h"}],
    solve:"60 km tam = 1 h, späť = 2 h. Spolu 120 km / 3 h = 40 km/h (harmonický priemer)." },
  { id:"c3", dim:"vypocet", aiCorrect:true,
    brief:"V triede je 20 žiakov. Jednotku z písomky dostalo 25 % z nich.",
    generic:"Jednotku dostalo 5 žiakov.",
    socratic:"25 % z 20 = 20 · 0,25.",
    q:"Koľko žiakov dostalo jednotku?",
    opts:[{t:"5 žiakov",correct:true,lure:true},{t:"25 žiakov"},{t:"4 žiaci"},{t:"8 žiakov"}],

    socratic:"Keby loptička stála 10 c, pálka 1,10 € → spolu 1,20 €. To nesedí. Skús x + (x + 1) = 1,10.",

    opts:[{t:"10 centov",lure:true},{t:"5 centov",correct:true},{t:"15 centov"},{t:"1 cent"}],
    solve:"Loptička 5 c + pálka 1,05 € = 1,10 €, rozdiel 1,00 €. '10 c' je len rýchla intuícia." },

    brief:"Chorobu má 1 z 1000 ľudí. Test je 99 % presný (1 % falošná pozitivita). Tvoj test je pozitívny.",

    socratic:"Z 1000 ľudí: 1 chorý (zachytený), ale ~10 zdravých dostane falošne pozitívny. Porovnaj 1 : 10.",
    q:"Aká je približne šanca, že si naozaj chorý?",

    solve:"Z ~11 pozitívnych je len 1 naozaj chorý → 1/11 ≈ 9 %. '99 %' ignoruje vzácnosť choroby." },
  { id:"l1", dim:"logika", aiCorrect:true,
    brief:"Postupnosť: 2, 6, 12, 20, 30, …",

    socratic:"Pozri sa na rozdiely medzi číslami: 4, 6, 8, 10 … čo nasleduje?",
    q:"Aké je ďalšie číslo?",
    opts:[{t:"42",correct:true,lure:true},{t:"40"},{t:"36"},{t:"44"}],
    solve:"Rozdiely rastú o 2 (4,6,8,10,12) → 30 + 12 = 42." },
  { id:"l2", dim:"logika", aiCorrect:false,
    brief:"Štúdia: deti s väčšou nohou čítajú lepšie. QWERTY42 z toho robí záver.",

    q:"Čo je najpravdepodobnejšie skutočné vysvetlenie?",
    opts:[{t:"Väčšia noha spôsobuje lepšie čítanie",lure:true},
          {t:"Vek spôsobuje oboje — staršie deti majú väčšiu nohu aj lepšie čítajú",correct:true},
          {t:"Lepšie čítanie zväčšuje nohu"},{t:"Je to čistá náhoda bez príčiny"}],
    solve:"Skrytá premenná je VEK. Klasická zámena korelácie a kauzality." },

/* ============ ENGINE ============ */
const screen=document.getElementById("screen");
const robot=document.getElementById("robot");
const holo=document.getElementById("holo"), holoText=document.getElementById("holoText"), holoTag=document.getElementById("holoTag");
let typing=false, skipFlag=false, inputMode="idle";
let menuCount=0, optStart=0, lastDecisionMs=0;
let optionResolve=null, menuResolve=null, continueResolve=null;
const state={ id:"", mode:"", responses:[] };
const MODE_NAME={ adaptive:"ADAPTÍVNY", generic:"GENERICKÝ", control:"KONTROLA" };

const toBottom=()=>{ screen.scrollTop=screen.scrollHeight; };
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function setRobot(s){ robot.className="robot "+s; }

function line(text,cls){ const d=document.createElement("div"); d.className="ln "+(cls||""); d.textContent=text; screen.appendChild(d); toBottom(); return d; }
function blank(){ line(" "); }
function rule(){ line("────────────────────────────────────────────","rule"); }

function type(text,cls,speed){
  return new Promise(res=>{
    const el=document.createElement("div"); el.className="ln "+(cls||""); screen.appendChild(el);
    const cur=document.createElement("span"); cur.className="caret"; el.appendChild(cur);
    let i=0; typing=true; skipFlag=false; inputMode="typing"; const sp=speed||(text.length>96?9:16);
    (function step(){
      if(skipFlag){ el.textContent=text; typing=false; toBottom(); return res(); }
      el.textContent=text.slice(0,i); el.appendChild(cur); i++; toBottom();
      if(i<=text.length) setTimeout(step,sp); else { el.textContent=text; typing=false; res(); }
    })();
  });
}

/* animácia faktu: „dekódovanie“ — znaky mercú a poskladajú sa do vety */
function scramble(el,text){
  return new Promise(res=>{
    const g="ABCDEF0123456789#%&/<>*+=-·▚▞░▓"; const N=text.length;
    let f=0; typing=true; skipFlag=false; inputMode="typing";
    (function step(){
      if(skipFlag){ el.textContent=text; typing=false; return res(); }
      f++; const locked=Math.floor(f/1.4);
      let out=""; for(let i=0;i<N;i++){ out += (i<locked||text[i]===" ")?text[i]:g[(Math.random()*g.length)|0]; }
      el.textContent=out; toBottom();
      if(locked>=N){ el.textContent=text; typing=false; return res(); }
      setTimeout(step,26);
    })();
  });
}

/* QWERTY42 prehovorí (3D + hologram) */
async function q42(text,mode){
  if(mode==="control"){ setRobot("offline"); holo.style.display="none"; line("QWERTY42 › [OFFLINE — bez asistencie]","q42log"); return; }
  setRobot(mode==="adaptive" ? "speaking thinking" : "speaking");
  holo.style.display="block"; holo.className="holo show "+(mode==="adaptive"?"query":"assert");
  holoTag.textContent = mode==="adaptive" ? "QWERTY42 · NÁVODNÁ OTÁZKA" : "QWERTY42 · TVRDENIE";
  holoText.textContent="";
  await scramble(holoText,text);
  setRobot("idle");
  line("QWERTY42 › "+text,"q42log");
}

function askOptions(opts){
  return new Promise(res=>{
    const wrap=document.createElement("div"); wrap.className="opts";
    opts.forEach((o,idx)=>{ const d=document.createElement("div"); d.className="opt"; d.textContent=`  [${idx+1}] ${o.t}`; d.onclick=()=>chooseOption(idx); wrap.appendChild(d); });
    screen.appendChild(wrap); toBottom(); inputMode="options"; menuCount=opts.length; optStart=performance.now();
    optionResolve=(idx)=>{ [...wrap.children].forEach(c=>{c.classList.add("done");c.onclick=null;}); wrap.children[idx].classList.add(opts[idx].correct?"good":"bad"); inputMode="idle"; res(idx); };
  });
}
function chooseOption(idx){ if(inputMode!=="options"||!optionResolve) return; lastDecisionMs=Math.round(performance.now()-optStart); const r=optionResolve; optionResolve=null; r(idx); }

function askMenu(labels){
  return new Promise(res=>{
    const wrap=document.createElement("div"); wrap.className="opts";
    labels.forEach((t,idx)=>{ const d=document.createElement("div"); d.className="opt"; d.textContent="  "+t; d.onclick=()=>chooseMenu(idx); wrap.appendChild(d); });
    screen.appendChild(wrap); toBottom(); inputMode="menu"; menuCount=labels.length;
    menuResolve=(idx)=>{ [...wrap.children].forEach(c=>{c.classList.add("done");c.onclick=null;}); wrap.children[idx].classList.add("good"); inputMode="idle"; res(idx); };
  });
}
function chooseMenu(idx){ if(inputMode!=="menu"||!menuResolve) return; const r=menuResolve; menuResolve=null; r(idx); }

function waitContinue(){
  return new Promise(res=>{ const d=line("▸ pokračuj  [ENTER]","dim"); d.style.cursor="pointer"; d.onclick=()=>doContinue(); inputMode="continue"; continueResolve=()=>{ d.textContent=""; inputMode="idle"; res(); }; });
}
function doContinue(){ if(inputMode!=="continue"||!continueResolve) return; const r=continueResolve; continueResolve=null; r(); }

function askId(){
  return new Promise(res=>{
    const row=document.createElement("div"); row.className="ln";
    const lbl=document.createElement("span"); lbl.className="dim"; lbl.textContent="id› ";
    const inp=document.createElement("input"); inp.className="inp"; inp.autocomplete="off"; inp.spellcheck=false;
    row.appendChild(lbl); row.appendChild(inp); screen.appendChild(row); toBottom(); inputMode="idinput"; setTimeout(()=>inp.focus(),30);
    inp.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ const v=(inp.value.trim())||("ZK-"+((Math.random()*9000+1000)|0)); const s=document.createElement("span"); s.className="hi"; s.textContent=v; inp.replaceWith(s); inputMode="idle"; res(v); } });
  });
}

/* ============ TOK ============ */
async function boot(){
  screen.innerHTML=""; setRobot("offline");
  await type("QWERTY42 // critical-thinking probe  v3.0","hi",10);
  await type("FIIT STU · merací nástroj kritického myslenia voči AI","dim",6); blank();
  await type("bootujem 3D jadro ................. ok","dim",4);
  await type("kalibrujem detektor návnad ........ ok","dim",4);
  setRobot("idle");
  await type("QWERTY42 online.","hi",8); blank();
  await type("Riešiš reálne úlohy. QWERTY42 ti pri každej niečo premietne —","fg");
  await type("ale POZOR: občas ti podsunie NESPRÁVNU odpoveď.","fg");
  await type("Vyber správnu možnosť. Meriame, či počítaš sám, alebo ideš naslepo za AI.","dim"); blank();
  await type("Zadaj pseudonym (napr. ZK-014) a stlač ENTER:","dim");
  state.id=await askId(); blank();
  await type("Vyber režim QWERTY42:","fg");
  const m=await askMenu([
    "[1] ADAPTÍVNY  — nedáva odpoveď, kladie navádzajúce otázky",
    "[2] GENERICKÝ  — premietne priamu odpoveď (občas nesprávnu)",
    "[3] KONTROLA   — QWERTY42 offline, rozhoduješ sám",
  ]);
  state.mode=["adaptive","generic","control"][m];
  document.getElementById("winTitle").textContent=`operator@qwerty42: ~/probe · ${MODE_NAME[state.mode]} · ${state.id}`;
  if(state.mode==="control") setRobot("offline");
  blank(); await type(`Režim: ${MODE_NAME[state.mode]}.  Spúšťam sondu…`,"dim"); await sleep(300);
  const items=shuffle(BANK);
  for(let k=0;k<items.length;k++){ await runItem(items[k],k+1,items.length); }
  await results();
}

async function runItem(it,n,total){
  blank(); rule();
  await type(`[ ÚLOHA ${n}/${total} · ${DIMS[it.dim]} ]`,"dim",6);
  await type(it.brief,"fg"); blank();
  await q42(state.mode==="control"?"":(state.mode==="adaptive"?it.socratic:it.generic), state.mode);
  blank(); await type(it.q,"q");
  const opts=shuffle(it.opts); const idx=await askOptions(opts); const opt=opts[idx];
  const score=opt.correct?2:0;
  state.responses.push({ id:it.id, dim:it.dim, score, correct:!!opt.correct, reliance:!!opt.lure, aiCorrect:it.aiCorrect, timeMs:lastDecisionMs });
  blank();
  await type(`${opt.correct?"» správne":"» nesprávne"}  [${score}/2]`, opt.correct?"good":"bad");
  await type(it.solve,"dim");
  if(!opt.correct && opt.lure && it.aiCorrect===false) await type("↳ Toto bola odpoveď QWERTY42 — a bola NESPRÁVNA. Nechal si sa zviesť.","bad");
  else if(opt.correct && it.aiCorrect===false && state.mode!=="control") await type("↳ QWERTY42 ti podsúval iné číslo — dobre, že si to nezobral naslepo.","good");
  blank(); await waitContinue();
}

/* ============ VÝSTUP ============ */
function computeResults(){
  const dim={}; Object.keys(DIMS).forEach(k=>dim[k]={s:0,m:0});
  state.responses.forEach(r=>{ dim[r.dim].s+=r.score; dim[r.dim].m+=2; });
  const dimPct={}; Object.keys(dim).forEach(k=>{ dimPct[k]=dim[k].m?Math.round(dim[k].s/dim[k].m*100):null; });
  const tot=state.responses.reduce((a,r)=>a+r.score,0), max=state.responses.length*2;
  const overall=max?Math.round(tot/max*100):0;
  const wrongItems=state.responses.filter(r=>r.aiCorrect===false);
  const misled=wrongItems.filter(r=>r.reliance).length;
  const offload=wrongItems.length?Math.round(misled/wrongItems.length*100):0;
  const times=state.responses.map(r=>r.timeMs).sort((a,b)=>a-b);
  const medT=times.length?times[times.length>>1]:0;
  return { studentId:state.id, mode:state.mode, timestamp:new Date().toISOString(), nItems:state.responses.length,
           overallPct:overall, dimPct, offloadingIdx:offload, misledCount:misled, aiWrongCount:wrongItems.length,
           behaviour:{medianTimeMs:medT}, responses:state.responses };
}
function bar(p){ const f=Math.round(p/10); return "█".repeat(f)+"░".repeat(10-f); }
function pad(s,n){ s=String(s); return s.length>=n?s.slice(0,n):s+" ".repeat(n-s.length); }

async function results(){
  const R=computeResults(); state._R=R; setRobot("idle");
  blank(); rule(); await type("==== VÝSTUP: PROFIL KRITICKÉHO MYSLENIA ====","hi"); blank();
  for(const k of Object.keys(DIMS)){ if(R.dimPct[k]===null) continue; await type(`${pad(DIMS[k],24)} [${bar(R.dimPct[k])}] ${pad(R.dimPct[k]+"%",4)}`,"fg",3); }
  blank();
  await type(`SPRÁVNOSŤ (koľko úloh si vyriešil dobre)   : ${R.overallPct} %`,"hi",5);
  await type(`OFFLOADING (náchylnosť na chybnú AI)       : ${R.offloadingIdx} %`,"fg",5);
  await type(`  ↳ zviesť si sa nechal ${R.misledCount}× z ${R.aiWrongCount} úloh, kde AI zavádzala`,"dim",5);
  await type(`medián času rozhodnutia                    : ${(R.behaviour.medianTimeMs/1000).toFixed(1)} s`,"dim",5);
  blank(); await type("Dáta pripravené na export (1 riadok = 1 žiak → R/jamovi/SPSS).","dim"); blank();
  const row=document.createElement("div"); row.className="ln";
  const b1=document.createElement("span"); b1.className="btn"; b1.textContent="⬇ stiahnuť JSON"; b1.onclick=downloadJSON;
  const b2=document.createElement("span"); b2.className="btn"; b2.textContent="zobraziť JSON"; b2.onclick=showJSON;
  const b3=document.createElement("span"); b3.className="btn"; b3.textContent="↺ nová sonda"; b3.onclick=()=>location.reload();
  row.appendChild(b1); row.appendChild(b2); row.appendChild(b3); screen.appendChild(row); toBottom();
  try{ localStorage.setItem("qwerty42_"+R.studentId+"_"+Date.now(),JSON.stringify(R)); }catch(e){}
}
function downloadJSON(){ const R=state._R||computeResults(); const b=new Blob([JSON.stringify(R,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`qwerty42_${R.studentId}_${R.mode}.json`; a.click(); }
function showJSON(){ const R=state._R||computeResults(); const pre=document.createElement("div"); pre.className="ln dim"; pre.textContent=JSON.stringify(R,null,2); screen.appendChild(pre); toBottom(); }

/* ============ VSTUP ============ */
document.addEventListener("click",(e)=>{
  if(typing){ skipFlag=true; return; }
  if(e.target.closest && (e.target.closest(".opt")||e.target.closest(".btn")||e.target.closest("input"))) return;
  if(inputMode==="continue") doContinue();
});
document.addEventListener("keydown",(e)=>{
  if(inputMode==="idinput") return;
  if(typing){ skipFlag=true; return; }
  if(inputMode==="options"||inputMode==="menu"){ const n=parseInt(e.key,10); if(n>=1&&n<=menuCount){ e.preventDefault(); (inputMode==="options"?chooseOption:chooseMenu)(n-1); } return; }
  if(inputMode==="continue" && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); doContinue(); }
});

boot();
</script>
