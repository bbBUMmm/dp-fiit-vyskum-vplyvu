<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test</title>
<style>
  :root { --ink:#16181d; --mut:#5d6470; --line:#d7dae0; --bg:#fbfbfc;
          --acc:#2b4c7e; --warn:#8a4b2a; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.55 system-ui, "Segoe UI", sans-serif;
         color:var(--ink); background:var(--bg); }
  .wrap { max-width:680px; margin:0 auto; padding:24px 18px 64px; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  .sub { color:var(--mut); font-size:.85rem; margin-bottom:22px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px;
          padding:20px; }
  .prog { height:4px; background:var(--line); border-radius:2px; margin-bottom:20px; }
  .prog > i { display:block; height:100%; background:var(--acc); border-radius:2px;
              transition:width .25s; }
  .stem { font-size:1.05rem; margin:0 0 18px; }
  .opt { display:block; border:1px solid var(--line); border-radius:8px;
         padding:11px 14px; margin-bottom:8px; cursor:pointer; background:#fff; }
  .opt:hover { border-color:var(--acc); }
  .opt input { margin-right:10px; }
  .opt.sel { border-color:var(--acc); background:#f2f6fc; }
  textarea, input[type=text] { width:100%; font:inherit; padding:10px;
         border:1px solid var(--line); border-radius:8px; }
  textarea { min-height:120px; resize:vertical; }
  .jol { margin:20px 0 4px; padding-top:18px; border-top:1px dashed var(--line); }
  .jol label { display:block; font-size:.9rem; color:var(--mut); margin-bottom:8px; }
  .jol input { width:100%; }
  .jolval { font-variant-numeric:tabular-nums; font-weight:600; }
  button { font:inherit; padding:11px 20px; border:0; border-radius:8px;
           background:var(--acc); color:#fff; cursor:pointer; margin-top:18px; }
  button:disabled { background:#aeb4bf; cursor:default; }
  .err { color:var(--warn); margin-top:12px; font-size:.92rem; }
  .note { color:var(--mut); font-size:.82rem; margin-top:18px; }
  code { background:#eef0f3; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Test</h1>
  <div class="sub" id="sub"></div>
  <div class="prog"><i id="bar" style="width:0"></i></div>
  <div class="card" id="card">Načítavam…</div>
</div>
<script src="test.js"></script>
</body>
</html>
