<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%233f3cbb%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-family=%22Arial%22 font-size=%2213%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3EAI%3C/text%3E%3C/svg%3E">
<title>Test</title>
<style>
  /* Same design tokens as the lesson app (exercise-client/static/style.css),
     inlined because the runner serves exactly two files. */
  :root { --bg:#f5f6fa; --surface:#fff; --surface-2:#f0f2f8; --surface-3:#e7eaf3; --ink:#111827; --ink-2:#374151;
          --muted:#6b7280; --line:#e3e6ee; --line-strong:#cdd2de; --primary:#3f3cbb; --primary-hover:#34319e;
          --primary-ink:#fff; --primary-soft:#eceafe; --accent:#0e7490; --good:#15803d; --good-soft:#e3f6e8;
          --warn:#a15c07; --warn-soft:#fdf1dc; --bad:#b42318; --bad-soft:#fde8e6;
          --focus:0 0 0 3px rgba(63,60,187,.35); --shadow:0 1px 2px rgba(17,24,39,.05),0 10px 30px rgba(17,24,39,.07);
          --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
          --mono:ui-monospace,"Cascadia Code",Consolas,monospace; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1117; --surface:#171a23; --surface-2:#1d212c; --surface-3:#262b38; --ink:#eef0f6; --ink-2:#c9cedb;
            --muted:#949bad; --line:#2a2f3c; --line-strong:#3a4152; --primary:#8c88ff; --primary-hover:#a19eff;
            --primary-ink:#0f1117; --primary-soft:#262447; --good:#4ade80; --good-soft:#12301d; --warn:#fbbf24;
            --warn-soft:#3a2a0c; --bad:#f87171; --bad-soft:#3b1715; --focus:0 0 0 3px rgba(140,136,255,.4);
            --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.35); color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:16px/1.55 var(--font); color:var(--ink); background:var(--bg); min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:28px 18px 64px; }
  .head { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .logo { display:inline-grid; place-items:center; width:36px; height:36px; border-radius:10px; flex:none;
          background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; font-weight:800; font-size:.9rem; }
  h1 { font-size:1.15rem; margin:0; line-height:1.3; }
  .sub { color:var(--muted); font-size:.85rem; }
  .prog { height:8px; background:var(--surface-3); border-radius:999px; margin:0 0 6px; overflow:hidden; }
  .prog > i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--primary),var(--accent)); border-radius:999px; transition:width .35s; }
  .prog-text { text-align:right; font-size:.78rem; color:var(--muted); margin-bottom:16px; font-variant-numeric:tabular-nums; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px; box-shadow:var(--shadow); }
  .eyebrow { font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .stem { font-size:1.1rem; line-height:1.6; margin:0 0 18px; white-space:pre-wrap; }
  .opt { display:flex; align-items:center; gap:12px; width:100%; text-align:left; font:inherit; color:var(--ink);
         background:var(--surface); border:1.5px solid var(--line-strong); border-radius:12px; padding:13px 15px;
         margin-bottom:9px; cursor:pointer; transition:border-color .15s, background .15s; }
  .opt:hover { border-color:var(--primary); }
  .opt input { position:absolute; opacity:0; pointer-events:none; }
  .opt .mark { flex:none; width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:var(--surface-2);
               font-weight:700; font-size:.9rem; color:var(--ink-2); }
  .opt.sel { border-color:var(--primary); background:var(--primary-soft); }
  .opt.sel .mark { background:var(--primary); color:var(--primary-ink); }
  .opt:focus-within { box-shadow:var(--focus); }
  .likert { display:grid; grid-template-columns:repeat(auto-fit,minmax(48px,1fr)); gap:8px; }
  .likert .opt { justify-content:center; padding:12px 0; margin:0; }
  .likert .opt .mark { width:auto; background:none; font-size:1.05rem; }
  .likert .opt.sel .mark { background:none; color:var(--primary); }
  .scale-ends { display:flex; justify-content:space-between; font-size:.78rem; color:var(--muted); margin-top:6px; }
  textarea, input[type=text] { width:100%; font:inherit; color:var(--ink); padding:11px 13px; background:var(--surface);
         border:1px solid var(--line-strong); border-radius:12px; }
  textarea { min-height:140px; resize:vertical; line-height:1.5; }
  textarea:focus, input:focus { outline:none; border-color:var(--primary); box-shadow:var(--focus); }
  .code { font-family:var(--mono); font-size:1.25rem; letter-spacing:.08em; text-transform:uppercase; text-align:center; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; border: 0; padding: 0; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: var(--line-strong); }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 999px; background: var(--line-strong); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -7px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
  /* not yet set: a uniform track and no thumb, so nothing on screen suggests a value */
  input[type=range].unset::-webkit-slider-thumb { opacity: 0; }
  input[type=range].unset::-moz-range-thumb { opacity: 0; }
  .jol { margin:22px 0 4px; padding:16px 18px; border-radius:12px; background:var(--primary-soft); }
  .jol label { display:block; font-size:.92rem; font-weight:600; color:var(--ink-2); margin-bottom:6px; }
  .jolval { font-variant-numeric:tabular-nums; font-weight:800; color:var(--primary); }
  .btn { appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; font:inherit; font-weight:650;
         min-height:48px; padding:11px 22px; border:0; border-radius:12px; background:var(--primary); color:var(--primary-ink);
         cursor:pointer; margin-top:20px; }
  .btn:hover:not(:disabled) { background:var(--primary-hover); }
  .btn:focus-visible { outline:none; box-shadow:var(--focus); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-block { width:100%; }
  .err { color:var(--bad); margin-top:12px; font-size:.92rem; min-height:1.2em; }
  .note { color:var(--muted); font-size:.82rem; margin-top:18px; line-height:1.45; }
  .done { text-align:center; padding:12px 4px; }
  .done .big { font-size:2.6rem; color:var(--good); }
  .banner { display:none; margin-bottom:14px; padding:10px 14px; border-radius:12px; background:var(--warn-soft); color:var(--warn); font-size:.9rem; font-weight:600; }
  .banner.show { display:block; }
  .ghost { appearance:none; flex:none; font:inherit; font-size:.875rem; font-weight:600; color:var(--ink-2); min-height:34px;
           padding:6px 12px; background:transparent; border:1px solid var(--line-strong); border-radius:10px; cursor:pointer; }
  .ghost:hover { background:var(--surface-2); }
  .ghost:focus-visible { outline:none; box-shadow:var(--focus); }
  /* the test section (runner.py --test) */
  .section-badge { display:inline-block; margin-top:4px; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
                   color:var(--accent); background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:2px 10px; }
  body.testy .logo { background:linear-gradient(135deg,var(--accent),var(--primary)); }
  .part-title { font-size:1.2rem; margin:0 0 10px; line-height:1.35; }
  .multiline { color:var(--ink-2); line-height:1.55; }
  .rf-p { margin:0 0 8px; }
  .pokyny { margin-top:22px; padding:14px 16px; border-radius:12px; background:var(--surface-2); }
  .stem .rf-p { margin:0 0 10px; }
  pre.code, pre.table { font-family:var(--mono); font-size:.86rem; line-height:1.45; white-space:pre; overflow-x:auto;
         background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:0 0 12px; }
  .stem pre.code { font-size:.9rem; }
  .conv { font-size:.92rem; color:var(--ink-2); margin-top:8px; }
  details.dohody, details.stim { margin:14px 0; }
  details.dohody summary, details.stim summary { cursor:pointer; font-weight:650; color:var(--primary); font-size:.92rem; }
  .stim-text { max-height:46vh; overflow:auto; padding:12px 14px; margin-top:8px; border:1px solid var(--line); border-radius:12px;
               background:var(--surface-2); font-size:.97rem; line-height:1.55; }
  .stim-text pre.table { background:var(--surface); font-variant-numeric:tabular-nums; }
  .mr-note { margin:0 0 8px; }
  .likert.wide { grid-template-columns:repeat(auto-fit,minmax(42px,1fr)); }
  .fields { display:grid; gap:10px; }
  .fld { display:grid; grid-template-columns:minmax(0,1fr) minmax(90px,170px) auto; align-items:center; gap:10px; }
  .fld label { font-size:.95rem; color:var(--ink-2); }
  .fld .unit { min-width:2.5em; color:var(--muted); font-variant-numeric:tabular-nums; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
  .actions .btn { margin-top:0; flex:1 1 180px; }
  .btn-quiet { background:var(--surface); color:var(--ink-2); border:1.5px solid var(--line-strong); }
  .btn-quiet:hover:not(:disabled) { background:var(--surface-2); }
  @media (max-width:560px) { .wrap { padding:18px 12px 48px; } .card { padding:18px; border-radius:14px; } .stem { font-size:1.04rem; }
    .fld { grid-template-columns:1fr auto; } .fld label { grid-column:1 / -1; } }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="logo" aria-hidden="true">AI</span>
    <div style="flex:1;min-width:0"><h1 id="title">Test</h1><div class="sub" id="sub"></div>
      <span class="section-badge" id="section" hidden>Sekcia testov · bez asistenta</span></div>
    <button class="ghost" id="consent-btn" type="button" aria-haspopup="dialog" hidden>Súhlas</button>
  </div>
  <div class="prog" role="progressbar" aria-label="Postup v teste"><i id="bar"></i></div>
  <div class="prog-text" id="progtext"></div>
  <div class="banner" id="banner" role="status" aria-live="polite"></div>
  <div class="card" id="card" aria-live="polite">Načítavam…</div>
</div>
<script src="consent.js"></script>
<script src="test.js"></script>
</body>
</html>
